services:
  discord-music:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Web dashboard (WEB_ENABLED=true in .env) only needs to be reachable by the
    # reverse proxy on this host — bound to loopback, not exposed externally.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:${WEB_PORT:-3000}"
